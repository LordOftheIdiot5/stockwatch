name: Immediate production workflow alerts
on:
  workflow_run:
    workflows: ["Scan", "Deploy dashboard", "Refresh official open data", "Stockwatch production health", "Private exchange archive", "Private daily observation archive", "Official delayed exchange availability"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/workflow_alert.py'
      - 'tests/test_workflow_alert.py'
      - '.github/workflows/workflow-alert.yml'
permissions:
  contents: read
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_workflow_alert.py' -v
  alert:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      # Never check out the triggering run's code or download its artifacts.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Send private incident notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/workflow_alert.py
