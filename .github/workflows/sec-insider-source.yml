name: SEC insider transaction source validation
on:
  pull_request:
    paths:
      - 'scripts/sec_insider_source.py'
      - 'tests/test_sec_insider_source.py'
      - '.github/workflows/sec-insider-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_sec_insider_source.py' -v
      - name: Validate official third-quarter 2026 archive
        env:
          STOCKWATCH_SEC_USER_AGENT: ${{ vars.STOCKWATCH_SEC_USER_AGENT }}
        run: python scripts/sec_insider_source.py
