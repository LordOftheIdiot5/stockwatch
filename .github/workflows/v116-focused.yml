name: V116 focused mobile and first-fold acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/v116-focused.yml'
      - 'tests/browser_check_news_320_v116.py'
      - 'tests/browser_check_firstfold_v116.py'
      - 'news-compact-v116.css'
      - 'overview-firstfold-v116.css'
      - 'overview-density-v116b.css'
      - 'overview-unified-v116c.css'
      - 'overview-unified-v116c.js'
      - 'overview-compact-v116e.css'
      - 'overview-layout-v116f.css'
      - 'source-precision-v116g.css'
      - 'tests/browser_check_source_precision_v116g.py'
      - 'v4.js'
      - 'tests/browser_check_layout_v116f.py'
      - 'overview-geo-v110e.js'
      - 'overview-structure-v110d.js'
      - 'tests/browser_check_v116e_coverage.py'
      - 'tests/browser_check_issuer_news_v116c.py'
      - 'tests/browser_check_zoom_equivalent_v116b.py'
      - 'news.html'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: News at 320px, both themes and opened drawer
        run: python tests/browser_check_news_320_v116.py
      - name: Source-accurate first fold at 1440, 1672 and 1920
        run: python tests/browser_check_firstfold_v116.py
      - name: V116b responsive 200%-zoom-equivalent layout, five routes
        run: python tests/browser_check_zoom_equivalent_v116b.py
      - name: V116e compact factual coverage, venue disclosure and keyboard map acceptance
        run: python tests/browser_check_v116e_coverage.py
      - name: V116f source-backed first-fold compact layout and browser-zoom diagnostic
        run: python tests/browser_check_layout_v116f.py
      - name: V116g truthful date-comparable market-source labels and keyboard disclosure
        run: python tests/browser_check_source_precision_v116g.py
      - name: V116c issuer evidence, acronym collision and reviewed news
        run: python tests/browser_check_issuer_news_v116c.py
      - name: Preserve first-fold screenshots on all outcomes
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-v116-focused
          path: |
            workspace-previews/v116-overview-firstfold-*.png
            workspace-previews/v116b-overview-equivalent-zoom-*.png
          if-no-files-found: ignore
          retention-days: 7
