name: GLEIF identity live validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/gleif_isin_lei.py'
      - 'tests/test_gleif_isin_lei.py'
      - '.github/workflows/gleif-identity-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_gleif_isin_lei.py' -v
      - run: python scripts/gleif_isin_lei.py --probe
