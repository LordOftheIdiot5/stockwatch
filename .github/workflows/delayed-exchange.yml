name: Official delayed exchange availability
on:
  schedule:
    - cron: '20 18 * * 1-5'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/delayed_exchange.py'
      - 'scripts/direct_exchange_audit.py'
      - 'tests/test_direct_exchange_audit.py'
      - 'scripts/exchange_capacity.py'
      - 'scripts/exchange_profile_audit.py'
      - 'tests/test_exchange_profile_audit.py'
      - 'tests/test_exchange_capacity.py'
      - 'tests/test_delayed_exchange.py'
      - 'scripts/exchange_identity.py'
      - 'tests/test_exchange_identity.py'
      - '.github/workflows/delayed-exchange.yml'
permissions:
  contents: read
concurrency:
  group: exchange-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Offline collector tests
        run: python -m unittest discover -s tests -p test_delayed_exchange.py
      - name: Check Oslo equity archive and Nasdaq discovery
        run: python scripts/delayed_exchange.py --market OSL --window PREVIOUS_TRADING_DAY

      - name: Exchange identity regression tests
        run: python -m unittest discover -s tests -p test_exchange_identity.py
      - name: Private Oslo ISIN and FIGI reconciliation
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          STOCKWATCH_OPENFIGI_KEY: ${{ secrets.STOCKWATCH_OPENFIGI_KEY }}
        run: python scripts/exchange_identity.py --market OSL

  profile:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Report profile audit tests
        run: python -m unittest discover -s tests -p test_exchange_profile_audit.py -v
      - name: Inspect Oslo exchange report schema (no quotes)
        run: python scripts/exchange_profile_audit.py --market OSL

  capacity:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Offline report capacity tests
        run: python -m unittest discover -s tests -p test_exchange_capacity.py -v
      - name: Measure seven previous-day equity reports
        run: python scripts/exchange_capacity.py

  direct-reference:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Direct-exchange reference tests
        run: python -m unittest discover -s tests -p test_direct_exchange_audit.py -v
      - name: Inspect Cboe overlap and official exchange landing pages (no quotes)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          STOCKWATCH_OPENFIGI_KEY: ${{ secrets.STOCKWATCH_OPENFIGI_KEY }}
        run: python scripts/direct_exchange_audit.py
