name: ESMA exact revision evidence validation
on:
  pull_request:
    paths:
      - 'scripts/esma_revision_evidence.py'
      - 'tests/test_esma_revision_evidence.py'
      - 'scripts/esma_revision_r2.py'
      - 'tests/test_esma_revision_r2.py'
      - '.github/workflows/esma-revision-evidence.yml'
  workflow_dispatch:
    inputs:
      retain_private:
        description: 'Retain exact scoped ESMA revision evidence and verify private R2 readback'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install defusedxml==0.7.1
      - run: python -m unittest discover -s tests -p 'test_esma_revision_evidence.py' -v
      - run: python -m unittest discover -s tests -p 'test_esma_revision_r2.py' -v
      - run: python scripts/esma_revision_evidence.py --write
      - uses: actions/upload-artifact@v5
        with:
          name: exact-esma-revision-evidence
          path: data/esma-delta-history/
          retention-days: 7
          if-no-files-found: error
      - name: Install private storage client
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.retain_private == true
        run: pip install 'boto3>=1.40,<2'
      - name: Archive exact revision evidence and verify readback
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.retain_private == true
        env:
          STOCKWATCH_ESMA_PRIVATE_RETENTION: 'true'
          STOCKWATCH_R2_BUCKET: ${{ vars.STOCKWATCH_R2_BUCKET }}
          STOCKWATCH_R2_ACCOUNT_ID: ${{ secrets.STOCKWATCH_R2_ACCOUNT_ID }}
          STOCKWATCH_R2_ACCESS_KEY_ID: ${{ secrets.STOCKWATCH_R2_ACCESS_KEY_ID }}
          STOCKWATCH_R2_SECRET_ACCESS_KEY: ${{ secrets.STOCKWATCH_R2_SECRET_ACCESS_KEY }}
        run: python scripts/esma_revision_r2.py
