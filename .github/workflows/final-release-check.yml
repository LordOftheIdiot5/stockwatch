          node --test tests/test_company_events_v87c.mjs
          python tests/browser_check_company_events_v87c.py

      - name: V87e ownership evidence checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v87e-')
        run: node --test tests/test_ownership_v87e.mjs

      - name: V87f company navigation checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v87f-')
        run: python tests/browser_check_company_navigation_v87f.py

      - name: V88 company driver map checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v88-')
