name: Final research release checks

on:
  pull_request:
    paths:
      - 'v4.js'
      - 'company-network-v84.js'
      - 'company-network-v84.css'
      - 'intelligence.html'
      - 'data/company-relationships.json'
      - 'data/company-image-catalog.json'
      - 'data/us-equity-seed.json'
      - 'terminal.js'
      - 'research-analytics.js'
      - 'research-lab.js'
      - 'worker/**'
      - 'data/research-product-catalog.json'
      - 'data/fundamentals.json'
      - 'terminal.html'
      - 'v4.css'
      - 'index.html'
      - 'welcome.html'
      - 'directory.html'
      - 'brand/**'
      - 'stocks.html'
      - 'company.html'
      - 'research.html'
      - 'data/research-targets.json'
      - 'data/research-expansion.json'
      - 'data/licensed-price-coverage.json'
      - 'price-history.html'
      - 'data/research-onboarding.json'
      - 'research.js'
      - 'scripts/**'
      - 'tests/**'
      - 'watchlist.json'
      - 'data/source-registry.json'
      - '.github/workflows/final-release-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Full scanner and research unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Worker API and A/B finance tests
        run: node --test tests/test_worker.mjs tests/test_final_js.mjs
      - name: Independent voyage model tests
        run: node --test tests/test_voyage_math.mjs
      - name: V21 workspace behavior tests
        run: node --test tests/test_workspace_v21.mjs
      - name: V25 chart math and validation
        run: node --test tests/test_chart_v25.mjs
      - name: V25b research universe tests
        run: node --test tests/test_universe_v25b.mjs
      - name: V26 intelligence graph tests
        run: node --test tests/test_intelligence_v26.mjs
      - name: V28 coverage and screener tests
        run: node --test tests/test_coverage_v28.mjs
      - name: V29 coverage and quick search tests
        run: node --test tests/test_expansion_v29.mjs
      - name: V30 aligned pair statistics
        run: node --test tests/test_pair_stats_v30.mjs
      - name: V30b display chart mappings
        run: node --test tests/test_chart_display_v30b.mjs
      - name: V31 terminal analytics
        run: node --test tests/test_terminal_v31.mjs
      - name: V32–45 analytics and catalog tests
        run: node --test tests/test_research_lab.mjs
      - name: Attention signal evidence and recency tests
        run: node --test tests/test_stock_attention.mjs
      - name: Price observation freshness tests
        run: node --test tests/test_price_freshness.mjs tests/test_historical_session.mjs tests/test_retained_heatmap_v85.mjs tests/test_older_map_v85c.mjs
      - name: A/B directional scenario tests
        run: node --test tests/test_ab_review.mjs
      - name: V51 session-safe screening tests
        run: |
          node --check screener-v51.js
          node --test tests/test_screener_v51.mjs
      - name: V53 quantitative research tests
        run: |
          node --check quant-v53.js
          node --test tests/test_quant_v53.mjs
      - name: V54 private revision history smoke test
        if: startsWith(github.head_ref, 'feature/stockwatch-v54-') || startsWith(github.head_ref, 'feature/stockwatch-v60-')
        run: |
          python scripts/financial_history.py --private-db "$RUNNER_TEMP/research-v54.sqlite"
          python scripts/research_assets.py --private-db "$RUNNER_TEMP/research-v46.sqlite"
      - name: V55 industry context tests
        run: |
          node --check industry-v55.js
          node --test tests/test_industry_v55.mjs
      - name: V56 voyage scenario calculation tests
        run: |
          node --check voyage-v56.js
          node --test tests/test_voyage_v56.mjs
      - name: V57 public research search tests
        run: |
          node --check brand/global-search.js
          node --test tests/test_global_search_v57.mjs
      - name: V58 data catalog tests
        run: |
          node --check brand/data-portal.js
          node --test tests/test_data_portal_v58.mjs
      - name: V59 saved workspace settings tests
        run: |
          node --check workspaces-v59.js
          node --test tests/test_workspaces_v59.mjs
      - name: Frontend syntax
        run: |
          node --check v4.js
          node --check terminal.js
          node --check research-analytics.js
          node --check research-lab.js
          node --check research.js
          node --check brand/brand.js
          node --check brand/research-coverage.js
      - name: Watchlist identity migration guard
        run: |
          python - <<'PY'
          import json
          w=json.load(open('watchlist.json'))['tickers']
          names=[x['ticker'] for x in w]
          assert len(w)==138 and len(set(names))==len(names)
          assert 'ALPER.PA' in names and 'PERR.PA' not in names
          print('Verified 138 unique companies and ALPER.PA migration')
          PY
      - name: Install browser-test dependencies
        run: |
          python -m pip install playwright==1.60.0
          python -m playwright install --with-deps chromium
      - name: V84 commercial network unit checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v84-') && hashFiles('company-network-v84.js') != ''
        run: |
          node --check company-network-v84.js
          node --test tests/test_company_network_v84.mjs
      - name: V84 commercial network and photo browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v84-') && hashFiles('company-network-v84.js') != ''
        run: python tests/browser_check_company_network_v84.py
      - name: Upload V84 rendered previews
        if: always() && startsWith(github.head_ref, 'feature/stockwatch-v84-')
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-v84-network
          path: workspace-previews/v84-*.png
          if-no-files-found: ignore
      - name: V85 both maps during full scanner outage
        run: python tests/browser_check_retained_heatmap_v85.py
      - name: V50 company research tests
        if: startsWith(github.head_ref, 'feature/stockwatch-v50-') || startsWith(github.head_ref, 'feature/stockwatch-v60-')
        run: |
          node --check company-research.js
          node --test tests/test_company_v50.mjs
      - name: V49 native chart core unit tests
        if: startsWith(github.head_ref, 'feature/stockwatch-v49-') || startsWith(github.head_ref, 'feature/stockwatch-v60-')
        run: |
          node --check native-chart.js
          node --test tests/test_native_chart_v49.mjs
      - name: V49 rendered chart interaction tests
        if: startsWith(github.head_ref, 'feature/stockwatch-v49-') || startsWith(github.head_ref, 'feature/stockwatch-v60-')
        run: python tests/browser_check_native_v49.py
      - name: Upload V49 chart previews
        if: always() && startsWith(github.head_ref, 'feature/stockwatch-v49-')
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-v49-native-chart
          path: workspace-previews/v49-*.png
          if-no-files-found: ignore
      - name: V50 rendered company research checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v50-') || startsWith(github.head_ref, 'feature/stockwatch-v60-')
        run: python tests/browser_check_company_v50.py
      - name: Upload V50 company previews
        if: always() && startsWith(github.head_ref, 'feature/stockwatch-v50-')
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-v50-company
          path: workspace-previews/v50-*.png
          if-no-files-found: ignore
      - name: V51 screener browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v51-') || startsWith(github.head_ref, 'feature/stockwatch-v60-') || startsWith(github.head_ref, 'feature/stockwatch-v52-') || startsWith(github.head_ref, 'feature/stockwatch-v68-')
        run: python tests/browser_check_screener_v51.py
      - name: Upload V51 screener previews
        if: always() && (startsWith(github.head_ref, 'feature/stockwatch-v51-') || startsWith(github.head_ref, 'feature/stockwatch-v68-'))
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-v51-screener
          path: |
            workspace-previews/v51-*.png
            workspace-previews/v68-*.png
          if-no-files-found: ignore
      - name: V52 synchronized terminal browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v52-') || startsWith(github.head_ref, 'feature/stockwatch-v60-')
        run: python tests/browser_check_terminal_v52.py
      - name: Upload V52 terminal previews
        if: always() && startsWith(github.head_ref, 'feature/stockwatch-v52-')
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-v52-terminal
          path: workspace-previews/v52-*.png
          if-no-files-found: ignore
      - name: V47 shared navigation rendered checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v47-') || startsWith(github.head_ref, 'feature/stockwatch-v60-')
        run: python tests/browser_check_shell_v47.py
      - name: Upload V47 screenshots
        if: always() && startsWith(github.head_ref, 'feature/stockwatch-v47-')
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-v47-shell
          path: workspace-previews/v47-*.png
          if-no-files-found: ignore

      - name: V48 pagination and mobile density browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v48-') || startsWith(github.head_ref, 'feature/stockwatch-v60-')
        run: python tests/browser_check_mobile_v48.py
      - name: Upload V48 mobile previews
        if: always() && startsWith(github.head_ref, 'feature/stockwatch-v48-')
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-v48-mobile
          path: workspace-previews/v48-*.png
          if-no-files-found: ignore

      - name: V21 desktop and mobile browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v21-')
        run: python tests/browser_check_v21.py
      - name: Upload workspace screenshots
        if: always() && startsWith(github.head_ref, 'feature/stockwatch-v21-')
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-v21-previews
          path: workspace-previews/
          if-no-files-found: ignore

      - name: V22 live OpenFIGI directory validation
        if: startsWith(github.head_ref, 'feature/stockwatch-v22-') && github.event.pull_request.head.repo.full_name == github.repository
        env:
          STOCKWATCH_OPENFIGI_KEY: ${{ secrets.STOCKWATCH_OPENFIGI_KEY }}
        run: |
          python scripts/instrument_directory.py
          python - <<'PY'
          import json
          d=json.load(open('data/instrument-directory.json'))
          assert len(d['records']) >= 100, d['venues']
          assert sum(v['status'] in ('ok','partial') for v in d['venues'].values()) >= 3, d['venues']
          assert all(r['quoteStatus']=='not_connected' for r in d['records'])
          print('Nordic reference records:',len(d['records']))
          PY
      - name: Upload V22 validated reference directory
        if: startsWith(github.head_ref, 'feature/stockwatch-v22-')
        uses: actions/upload-artifact@v5
        with:
          name: v22-instrument-directory
          path: data/instrument-directory.json
      - name: V22 landing and live-directory browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v22-')
        run: python tests/browser_check_v22.py
      - name: Upload V22 landing previews
        if: always() && startsWith(github.head_ref, 'feature/stockwatch-v22-')
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-v22-previews
          path: workspace-previews/
          if-no-files-found: ignore
      - name: V23 company research browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v23-')
        run: python tests/browser_check_v23.py
      - name: Upload V23 research previews
        if: always() && startsWith(github.head_ref, 'feature/stockwatch-v23-')
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-v23-previews
          path: workspace-previews/
          if-no-files-found: ignore

      - name: V24 live mapping and history audit
        if: startsWith(github.head_ref, 'feature/stockwatch-v24-') && github.event.pull_request.head.repo.full_name == github.repository
        env:
          STOCKWATCH_OPENFIGI_KEY: ${{ secrets.STOCKWATCH_OPENFIGI_KEY }}
        run: |
          python scripts/research_coverage.py
          python scripts/history_coverage.py
          python - <<'PY'
          import json
          d=json.load(open('data/research-coverage.json'))
          assert len(d['records'])==75
          assert sum(r['mappingStatus']=='candidate' for r in d['records'])>=30
          assert all(r['quoteStatus']=='not_connected' for r in d['records'])
          PY
      - name: V24 public research browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v24-')
        run: python tests/browser_check_v24.py

      - name: V25 interactive research chart browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v25-')
        run: python tests/browser_check_v25.py
      - name: Upload V25 production-state previews
        if: always() && startsWith(github.head_ref, 'feature/stockwatch-v25-')
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-v25-previews
          path: workspace-previews/
          if-no-files-found: ignore

      - name: V25b expanded equity directory browser check
        if: startsWith(github.head_ref, 'feature/stockwatch-v25b-')
        run: python tests/browser_check_v25b.py

      - name: V26 graph browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v26-')
        run: python tests/browser_check_v26.py
      - name: Upload V26 graph previews
        if: always() && startsWith(github.head_ref, 'feature/stockwatch-v26-')
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-v26-previews
          path: workspace-previews/
          if-no-files-found: ignore

      - name: V28 homepage and screener browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v28-')
        run: python tests/browser_check_v28.py

      - name: V29 expanded research browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v29-')
        run: python tests/browser_check_v29.py

      - name: V29b licensed reference price browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v29b-')
        run: python tests/browser_check_v29b.py

      - name: V29f A/B discovery and price priority browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v29f-')
        run: python tests/browser_check_v29f.py

      - name: V60 full candidate browser audit
        if: startsWith(github.head_ref, 'feature/stockwatch-v60-')
        run: python tests/browser_check_v60.py
      - name: Upload V60 evidence even on failure
        if: always() && startsWith(github.head_ref, 'feature/stockwatch-v60-')
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-v60-audit
          path: workspace-previews/v60-*
          if-no-files-found: ignore
      - name: V30b chart display integration checks
        run: python tests/browser_check_v30b.py

      - name: V31 research terminal browser checks
        run: python tests/browser_check_v31.py
      - name: Upload V31 previews
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-v31-terminal-previews
          path: workspace-previews/v31-terminal-*.png
          if-no-files-found: ignore

      - name: Modern overview desktop and mobile checks
        if: (startsWith(github.head_ref, 'feature/stockwatch-modern-overview-') || startsWith(github.head_ref, 'feature/stockwatch-frontpage-price-integrity-') || startsWith(github.head_ref, 'feature/stockwatch-historical-session-fallback-') || startsWith(github.head_ref, 'feature/stockwatch-session-screener-') || startsWith(github.head_ref, 'feature/stockwatch-data-first-dashboard-'))
        run: python tests/browser_check_modern_overview.py
      - name: Upload modern overview previews
        if: always() && (startsWith(github.head_ref, 'feature/stockwatch-modern-overview-') || startsWith(github.head_ref, 'feature/stockwatch-frontpage-price-integrity-') || startsWith(github.head_ref, 'feature/stockwatch-historical-session-fallback-') || startsWith(github.head_ref, 'feature/stockwatch-session-screener-') || startsWith(github.head_ref, 'feature/stockwatch-data-first-dashboard-'))
        uses: actions/upload-artifact@v5
        with:
          name: modern-overview-previews
          path: workspace-previews/modern-overview-*.png
          if-no-files-found: ignore
      - name: V87c company event lens checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v87c-')
        run: |
          node --test tests/test_company_events_v87c.mjs
          python tests/browser_check_company_events_v87c.py

      - name: Research lab browser checks
        run: python tests/browser_check_research_lab.py

      - name: Bounded live price-provider diagnostic (status only)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'feature/stockwatch-ab-expansion-') || startsWith(github.head_ref, 'feature/stockwatch-freshness-operations-') || startsWith(github.head_ref, 'feature/stockwatch-exact-day-validation-')
        run: python scripts/price_provider_diagnostic.py
