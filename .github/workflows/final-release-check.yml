name: Final research release checks

on:
  pull_request:
    paths:
      - 'v4.js'
      - 'terminal.js'
      - 'terminal.html'
      - 'v4.css'
      - 'index.html'
      - 'welcome.html'
      - 'directory.html'
      - 'brand/**'
      - 'stocks.html'
      - 'company.html'
      - 'research.html'
      - 'data/research-targets.json'
      - 'data/research-expansion.json'
      - 'data/licensed-price-coverage.json'
      - 'price-history.html'
      - 'data/research-onboarding.json'
      - 'research.js'
      - 'scripts/**'
      - 'tests/**'
      - 'watchlist.json'
      - 'data/source-registry.json'
      - '.github/workflows/final-release-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Full scanner and research unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Worker API and A/B finance tests
        run: node --test tests/test_worker.mjs tests/test_final_js.mjs
      - name: Independent voyage model tests
        run: node --test tests/test_voyage_math.mjs
      - name: V21 workspace behavior tests
        run: node --test tests/test_workspace_v21.mjs
      - name: V25 chart math and validation
        run: node --test tests/test_chart_v25.mjs
      - name: V25b research universe tests
        run: node --test tests/test_universe_v25b.mjs
      - name: V26 intelligence graph tests
        run: node --test tests/test_intelligence_v26.mjs
      - name: V28 coverage and screener tests
        run: node --test tests/test_coverage_v28.mjs
      - name: V29 coverage and quick search tests
        run: node --test tests/test_expansion_v29.mjs
      - name: V30 aligned pair statistics
        run: node --test tests/test_pair_stats_v30.mjs
      - name: V30b display chart mappings
        run: node --test tests/test_chart_display_v30b.mjs
      - name: V31 terminal analytics
        run: node --test tests/test_terminal_v31.mjs
      - name: Frontend syntax
        run: |
          node --check v4.js
          node --check terminal.js
          node --check research.js
          node --check brand/brand.js
          node --check brand/research-coverage.js
      - name: Watchlist identity migration guard
        run: |
          python - <<'PY'
          import json
          w=json.load(open('watchlist.json'))['tickers']
          names=[x['ticker'] for x in w]
          assert len(w)==138 and len(set(names))==len(names)
          assert 'ALPER.PA' in names and 'PERR.PA' not in names
          print('Verified 138 unique companies and ALPER.PA migration')
          PY
      - name: Install browser-test dependencies
        if: startsWith(github.head_ref, 'feature/stockwatch-v21-') || startsWith(github.head_ref, 'feature/stockwatch-v22-') || startsWith(github.head_ref, 'feature/stockwatch-v23-') || startsWith(github.head_ref, 'feature/stockwatch-v24-') || startsWith(github.head_ref, 'feature/stockwatch-v25-') || startsWith(github.head_ref, 'feature/stockwatch-v25b-') || startsWith(github.head_ref, 'feature/stockwatch-v26-') || startsWith(github.head_ref, 'feature/stockwatch-v28-') || startsWith(github.head_ref, 'feature/stockwatch-v29-') || startsWith(github.head_ref, 'feature/stockwatch-v29b-') || startsWith(github.head_ref, 'feature/stockwatch-v29f-') || startsWith(github.head_ref, 'feature/stockwatch-v30b-') || startsWith(github.head_ref, 'feature/stockwatch-v31-')
        run: |
          python -m pip install playwright==1.60.0
          python -m playwright install --with-deps chromium
      - name: V21 desktop and mobile browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v21-')
        run: python tests/browser_check_v21.py
      - name: Upload workspace screenshots
        if: always() && startsWith(github.head_ref, 'feature/stockwatch-v21-')
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-v21-previews
          path: workspace-previews/
          if-no-files-found: ignore

      - name: V22 live OpenFIGI directory validation
        if: startsWith(github.head_ref, 'feature/stockwatch-v22-') && github.event.pull_request.head.repo.full_name == github.repository
        env:
          STOCKWATCH_OPENFIGI_KEY: ${{ secrets.STOCKWATCH_OPENFIGI_KEY }}
        run: |
          python scripts/instrument_directory.py
          python - <<'PY'
          import json
          d=json.load(open('data/instrument-directory.json'))
          assert len(d['records']) >= 100, d['venues']
          assert sum(v['status'] in ('ok','partial') for v in d['venues'].values()) >= 3, d['venues']
          assert all(r['quoteStatus']=='not_connected' for r in d['records'])
          print('Nordic reference records:',len(d['records']))
          PY
      - name: Upload V22 validated reference directory
        if: startsWith(github.head_ref, 'feature/stockwatch-v22-')
        uses: actions/upload-artifact@v5
        with:
          name: v22-instrument-directory
          path: data/instrument-directory.json
      - name: V22 landing and live-directory browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v22-')
        run: python tests/browser_check_v22.py
      - name: Upload V22 landing previews
        if: always() && startsWith(github.head_ref, 'feature/stockwatch-v22-')
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-v22-previews
          path: workspace-previews/
          if-no-files-found: ignore
      - name: V23 company research browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v23-')
        run: python tests/browser_check_v23.py
      - name: Upload V23 research previews
        if: always() && startsWith(github.head_ref, 'feature/stockwatch-v23-')
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-v23-previews
          path: workspace-previews/
          if-no-files-found: ignore

      - name: V24 live mapping and history audit
        if: startsWith(github.head_ref, 'feature/stockwatch-v24-') && github.event.pull_request.head.repo.full_name == github.repository
        env:
          STOCKWATCH_OPENFIGI_KEY: ${{ secrets.STOCKWATCH_OPENFIGI_KEY }}
        run: |
          python scripts/research_coverage.py
          python scripts/history_coverage.py
          python - <<'PY'
          import json
          d=json.load(open('data/research-coverage.json'))
          assert len(d['records'])==75
          assert sum(r['mappingStatus']=='candidate' for r in d['records'])>=30
          assert all(r['quoteStatus']=='not_connected' for r in d['records'])
          PY
      - name: V24 public research browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v24-')
        run: python tests/browser_check_v24.py

      - name: V25 interactive research chart browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v25-')
        run: python tests/browser_check_v25.py
      - name: Upload V25 production-state previews
        if: always() && startsWith(github.head_ref, 'feature/stockwatch-v25-')
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-v25-previews
          path: workspace-previews/
          if-no-files-found: ignore

      - name: V25b expanded equity directory browser check
        if: startsWith(github.head_ref, 'feature/stockwatch-v25b-')
        run: python tests/browser_check_v25b.py

      - name: V26 graph browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v26-')
        run: python tests/browser_check_v26.py
      - name: Upload V26 graph previews
        if: always() && startsWith(github.head_ref, 'feature/stockwatch-v26-')
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-v26-previews
          path: workspace-previews/
          if-no-files-found: ignore

      - name: V28 homepage and screener browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v28-')
        run: python tests/browser_check_v28.py

      - name: V29 expanded research browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v29-')
        run: python tests/browser_check_v29.py

      - name: V29b licensed reference price browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v29b-')
        run: python tests/browser_check_v29b.py

      - name: V29f A/B discovery and price priority browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v29f-')
        run: python tests/browser_check_v29f.py

      - name: V30b chart display integration checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v30b-')
        run: python tests/browser_check_v30b.py

      - name: V31 research terminal browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v31-')
        run: python tests/browser_check_v31.py
      - name: Upload V31 previews
        if: always() && startsWith(github.head_ref, 'feature/stockwatch-v31-')
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-v31-terminal-previews
          path: workspace-previews/
          if-no-files-found: ignore
