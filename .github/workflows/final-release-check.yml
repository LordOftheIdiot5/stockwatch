name: Final research release checks

on:
  pull_request:
    paths:
      - 'v4.js'
      - 'v4.css'
      - 'index.html'
      - 'welcome.html'
      - 'directory.html'
      - 'brand/**'
      - 'stocks.html'
      - 'research.js'
      - 'scripts/**'
      - 'tests/**'
      - 'watchlist.json'
      - 'data/source-registry.json'
      - '.github/workflows/final-release-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Full scanner and research unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Worker API and A/B finance tests
        run: node --test tests/test_worker.mjs tests/test_final_js.mjs
      - name: Independent voyage model tests
        run: node --test tests/test_voyage_math.mjs
      - name: V21 workspace behavior tests
        run: node --test tests/test_workspace_v21.mjs
      - name: Frontend syntax
        run: |
          node --check v4.js
          node --check research.js
          node --check brand/brand.js
      - name: Watchlist identity migration guard
        run: |
          python - <<'PY'
          import json
          w=json.load(open('watchlist.json'))['tickers']
          names=[x['ticker'] for x in w]
          assert len(w)==138 and len(set(names))==len(names)
          assert 'ALPER.PA' in names and 'PERR.PA' not in names
          print('Verified 138 unique companies and ALPER.PA migration')
          PY
      - name: Install browser-test dependencies
        if: startsWith(github.head_ref, 'feature/stockwatch-v21-')
        run: |
          python -m pip install playwright==1.60.0
          python -m playwright install --with-deps chromium
      - name: V21 desktop and mobile browser checks
        if: startsWith(github.head_ref, 'feature/stockwatch-v21-')
        run: python tests/browser_check_v21.py
      - name: Upload workspace screenshots
        if: always() && startsWith(github.head_ref, 'feature/stockwatch-v21-')
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-v21-previews
          path: workspace-previews/
          if-no-files-found: ignore

      - name: V22 live OpenFIGI directory validation
        if: startsWith(github.head_ref, 'feature/stockwatch-v22-') && github.event.pull_request.head.repo.full_name == github.repository
        env:
          STOCKWATCH_OPENFIGI_KEY: ${{ secrets.STOCKWATCH_OPENFIGI_KEY }}
        run: |
          python scripts/instrument_directory.py
          python - <<'PY'
          import json
          d=json.load(open('data/instrument-directory.json'))
          assert len(d['records']) >= 100, d['venues']
          assert sum(v['status'] in ('ok','partial') for v in d['venues'].values()) >= 3, d['venues']
          assert all(r['quoteStatus']=='not_connected' for r in d['records'])
          print('Nordic reference records:',len(d['records']))
          PY
      - name: Upload V22 validated reference directory
        if: startsWith(github.head_ref, 'feature/stockwatch-v22-')
        uses: actions/upload-artifact@v5
        with:
          name: v22-instrument-directory
          path: data/instrument-directory.json
