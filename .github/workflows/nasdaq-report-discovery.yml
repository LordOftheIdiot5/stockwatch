name: Nasdaq Nordic delayed report availability
on:
  pull_request:
    paths:
      - 'scripts/nasdaq_report_discovery.py'
      - 'tests/test_nasdaq_report_discovery.py'
      - '.github/workflows/nasdaq-report-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_nasdaq_report_discovery.py' -v
      - run: python scripts/nasdaq_report_discovery.py
