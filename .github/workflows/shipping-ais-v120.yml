name: V120 AIS source validation
on:
  pull_request:
    paths:
      - 'scripts/fintraffic_ais_v120.py'
      - 'shipping-atlas-v118.js'
      - 'shipping-mapfirst-v119.css'
      - 'shipping.html'
      - 'data/shipping-ais-v120-config.json'
      - 'tests/browser_check_shipping_ais_v120.py'
      - 'worker/marine-ais-v120.mjs'
      - 'tests/test_marine_ais_worker_v120.mjs'
      - 'deploy/wrangler-marine-ais-v120.toml.example'
      - 'tests/test_fintraffic_ais_v120.py'
      - 'docs/STOCKWATCH-V120-AIS-PROVIDER-INTEGRATION-2026-11-23.md'
      - '.github/workflows/shipping-ais-v120.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Confirm Python source compiles
        run: python -m py_compile scripts/fintraffic_ais_v120.py
      - name: Run offline AIS provenance, privacy and freshness tests
        run: python -m unittest discover -s tests -p 'test_fintraffic_ais_v120.py' -v
      - name: Validate isolated maritime Worker and source fixture
        run: |
          node --check worker/marine-ais-v120.mjs
          node --test tests/test_marine_ais_worker_v120.mjs
      - name: Install Chromium for AIS browser tests
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify gated AIS UI with real-source-shaped test responses
        run: python tests/browser_check_shipping_ais_v120.py
      - name: Block accidental public pilot AIS export
        run: |
          test ! -f data/ais-vessels.json
          test ! -f data/shipping-ais-live.json
