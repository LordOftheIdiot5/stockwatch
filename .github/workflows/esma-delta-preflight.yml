name: ESMA delta action preflight
on:
  pull_request:
    paths:
      - 'scripts/esma_delta_preflight.py'
      - 'tests/test_esma_delta_preflight.py'
      - '.github/workflows/esma-delta-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install defusedxml==0.7.1
      - run: python -m unittest discover -s tests -p 'test_esma_delta_preflight.py' -v
      - run: python scripts/esma_delta_preflight.py
