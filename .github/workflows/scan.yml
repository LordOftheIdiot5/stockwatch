name: Scan

on:
  # Hourly across European market hours. Cron is UTC and does not know about
  # daylight saving, so the window is deliberately wide: 06:00-17:00 UTC covers
  # 07:00-18:00 CET in winter and 08:00-19:00 CEST in summer, which brackets
  # Oslo, Stockholm, XETRA, Paris and London in both halves of the year.
  schedule:
    - cron: "5 6-17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      fresh: ${{ steps.scan.outputs.fresh }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test signal logic
        run: python tests/test_signals.py

      - name: Scan
        id: scan
        env:
          # Whichever of these exist are used, best first, and the scan works
          # with none of them set. See scripts/translate.py.
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: python scripts/scan.py

      - name: Notify
        if: steps.scan.outputs.fresh != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify.py

      - name: Commit results
        run: |
          git config user.name "stockwatch"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "scan: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

  # This job is the reason the page could go stale while every scan succeeded.
  #
  # A push made with the built-in GITHUB_TOKEN does not start another workflow -
  # GitHub blocks that so a workflow cannot retrigger itself forever. The commit
  # above therefore lands fresh data on main, and the Deploy workflow, which
  # listens for pushes, never hears it. The repository would update hourly while
  # the published page kept serving whatever a human last pushed by hand.
  #
  # So the scan publishes its own results rather than waiting to be noticed.
  deploy:
    needs: scan
    runs-on: ubuntu-latest
    # The same group the Deploy workflow uses, so a scheduled publish and a
    # hand pushed one queue behind each other instead of racing for the
    # environment - they would otherwise be serialised only by luck.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Explicitly main, not the workflow's own SHA: that commit predates the
      # one the scan just pushed, so checking it out would publish the data this
      # run has already replaced.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
