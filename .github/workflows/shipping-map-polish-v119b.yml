name: Shipping V119b map readability acceptance
on:
  pull_request:
    paths:
      - 'shipping-atlas-v118.js'
      - 'shipping-mapfirst-v119.js'
      - 'shipping-map-polish-v119b.css'
      - 'shipping.html'
      - 'tests/browser_check_shipping_map_polish_v119b.py'
      - '.github/workflows/shipping-map-polish-v119b.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map-polish:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate map scripts and no invented AIS
        run: |
          node --check shipping-atlas-v118.js
          node --check shipping-mapfirst-v119.js
          node --test tests/test_shipping_mapfirst_v119.mjs
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check readability across seven widths and two themes
        run: python tests/browser_check_shipping_map_polish_v119b.py
      - name: Capture map screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: shipping-polish-v119b-screenshots
          path: workspace-previews/shipping-polish-v119b-*.png
          if-no-files-found: ignore
          retention-days: 14
