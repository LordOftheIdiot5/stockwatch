name: Expanded Euronext trade coverage
on:
  pull_request:
    paths:
      - 'scripts/expanded_euronext_coverage.py'
      - 'tests/test_expanded_euronext_coverage.py'
      - '.github/workflows/expanded-euronext-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install defusedxml==0.7.1
      - run: python -m unittest discover -s tests -p 'test_expanded_euronext_coverage.py' -v
      - name: Resolve and validate exact report matches
        if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          STOCKWATCH_OPENFIGI_KEY: ${{ secrets.STOCKWATCH_OPENFIGI_KEY }}
        run: python scripts/expanded_euronext_coverage.py
