name: SEC 13F source validation
on:
  pull_request:
    paths:
      - 'scripts/sec13f_source.py'
      - 'tests/test_sec13f_source.py'
      - '.github/workflows/sec13f-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_sec13f_source.py' -v
      - name: Inspect official archive
        env:
          STOCKWATCH_SEC_USER_AGENT: ${{ vars.STOCKWATCH_SEC_USER_AGENT }}
        run: python scripts/sec13f_source.py
