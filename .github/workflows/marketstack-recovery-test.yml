name: Marketstack private recovery test
on:
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      session:
        description: Completed exchange session (YYYY-MM-DD)
        required: true
        type: string
        default: '2026-11-16'
      run_live:
        description: Confirm plan permits private evaluation and sufficient quota remains
        type: boolean
        default: false
      budget:
        description: Maximum symbol requests
        type: number
        default: 20
      mode:
        description: Symbols to test
        type: choice
        options: [sample, missing, catalogue]
        default: sample
permissions:
  contents: read
jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/stockwatch-marketstack-recovery-20261117')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify private probe
        run: python -m unittest discover -s tests -p test_marketstack_recovery.py -v
      - name: Run authorized live evaluation
        if: github.event_name == 'pull_request' || inputs.run_live
        env:
          STOCKWATCH_MARKETSTACK_API_KEY: ${{ secrets.STOCKWATCH_MARKETSTACK_API_KEY }}
          SESSION: ${{ inputs.session || '2026-11-16' }}
          BUDGET: ${{ inputs.budget || 20 }}
          MODE: ${{ inputs.mode || 'sample' }}
        run: python scripts/marketstack_recovery_probe.py --date "$SESSION" --budget "$BUDGET" --mode "$MODE" --authorized-test
