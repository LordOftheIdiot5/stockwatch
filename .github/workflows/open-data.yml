name: Refresh official open data
on:
  schedule:
    - cron: "40 4 * * 1-5"
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/stockwatch-open-official-data-20261113
      - feature/stockwatch-worldbank-port-traffic-20261113
      - feature/stockwatch-maritime-intelligence-v5-20261113
    paths:
      - scripts/open_data.py
      - scripts/registered_sources.py
      - scripts/economic_feeds.py
      - scripts/shipping_open.py
      - scripts/shipping_ports.py
      - scripts/shipping_unctad.py
      - scripts/publish_data.py
      - tests/test_open_data.py
      - tests/test_registered_sources.py
      - tests/test_economic_feeds.py
      - tests/test_shipping_open.py
      - tests/test_shipping_ports.py
      - tests/test_shipping_unctad.py
      - tests/test_publish_data.py
      - .github/workflows/open-data.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install UNCTAD bulk archive decoder
        run: python -m pip install py7zr==1.1.2
      - name: Test official source integration
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate registered connector contracts
        run: python -m unittest discover -s tests -p 'test_registered_sources.py'
      - name: Validate frontend JavaScript
        run: |
          node --check v4.js
          node --check research.js
      - name: Validate official no-key API requests on development branch
        if: github.ref == 'refs/heads/feature/stockwatch-open-official-data-20261113'
        run: python scripts/open_data.py --mode daily
      - name: Verify live World Bank TEU import (feature branch only)
        if: github.ref == 'refs/heads/feature/stockwatch-worldbank-port-traffic-20261113'
        run: |
          python scripts/shipping_ports.py
          python scripts/shipping_unctad.py
          python - <<'PY'
          import json
          p=json.load(open('data/shipping-ports.json',encoding='utf-8'))
          s=p['source']
          assert s['status']=='ok', f"World Bank import failed: {s}"
          assert len(p['series']) >= 5
          assert all(x['isActualRate'] is False and x['unit']=='TEU'
                     for x in p['series'])
          print('World Bank live TEU series:',len(p['series']))
          PY
      - name: Validate live UNCTAD monthly connectivity import (isolated feature branch)
        if: github.ref == 'refs/heads/feature/stockwatch-maritime-intelligence-v5-20261113'
        run: |
          python scripts/shipping_unctad.py
          python - <<'PY'
          import json
          data=json.load(open('data/shipping-connectivity.json',encoding='utf-8'))
          assert data['source']['status']=='ok', data['source']
          assert len(data['series'])>=5
          assert all(s['isActualRate'] is False and s['frequency']=='monthly' for s in data['series'])
          print('UNCTAD live monthly series:',len(data['series']))
          PY
      - name: Fetch official no-key and registered-source data
        if: github.ref == 'refs/heads/main'
        env:
          STOCKWATCH_OPENFIGI_KEY: ${{ secrets.STOCKWATCH_OPENFIGI_KEY }}
          STOCKWATCH_ENTSOE_TOKEN: ${{ secrets.STOCKWATCH_ENTSOE_TOKEN }}
          STOCKWATCH_FRED_API_KEY: ${{ secrets.STOCKWATCH_FRED_API_KEY }}
          STOCKWATCH_EIA_API_KEY: ${{ secrets.STOCKWATCH_EIA_API_KEY }}
        run: |
          python scripts/open_data.py --mode auto
          python scripts/registered_sources.py
          python scripts/economic_feeds.py
          python scripts/shipping_open.py
          python scripts/shipping_ports.py
      - name: Commit official-source datasets without racing the market scanner
        if: github.ref == 'refs/heads/main'
        run: python scripts/publish_data.py --mode official
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
