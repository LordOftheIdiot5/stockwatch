name: Refresh official open data
on:
  schedule:
    - cron: "40 4 * * 1-5"
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/stockwatch-open-official-data-20261113
      - feature/stockwatch-worldbank-port-traffic-20261113
      - feature/stockwatch-maritime-intelligence-v5-20261113
      - feature/entsoe-open-energy-20261116
      - feature/stockwatch-free-research-data-20261117
      - feature/stockwatch-nordic-sources-20261117
      - feature/stockwatch-dataset-storage-20261117
    paths:
      - scripts/open_data.py
      - scripts/collect_roro_traffic.py
      - scripts/recover_official_archive.py
      - tests/test_recover_official_archive.py
      - scripts/free_research.py
      - scripts/dataset_store.py
      - tests/test_dataset_store.py
      - scripts/nordic_sources.py
      - tests/test_nordic_sources.py
      - tests/test_free_research.py
      - scripts/registered_sources.py
      - scripts/instrument_directory.py
      - scripts/research_coverage.py
      - scripts/history_coverage.py
      - data/research-targets.json
      - tests/test_instrument_directory.py
      - scripts/entsoe_open.py
      - tests/test_entsoe_open.py
      - scripts/economic_feeds.py
      - scripts/shipping_open.py
      - scripts/shipping_ports.py
      - scripts/shipping_unctad.py
      - scripts/publish_data.py
      - tests/test_open_data.py
      - tests/test_registered_sources.py
      - tests/test_economic_feeds.py
      - tests/test_shipping_open.py
      - tests/test_shipping_ports.py
      - tests/test_shipping_unctad.py
      - tests/test_publish_data.py
      - .github/workflows/open-data.yml
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install UNCTAD bulk archive decoder
        run: python -m pip install py7zr==1.1.4 defusedxml==0.7.1
      - name: Test official source integration
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate registered connector contracts
        run: python -m unittest discover -s tests -p 'test_registered_sources.py'
      - name: Validate frontend JavaScript
        run: |
          node --check v4.js
          node --check research.js
      - name: Validate official no-key API requests on development branch
        if: github.ref == 'refs/heads/feature/stockwatch-open-official-data-20261113'
        run: python scripts/open_data.py --mode daily
      - name: Verify live World Bank TEU import (feature branch only)
        if: github.ref == 'refs/heads/feature/stockwatch-worldbank-port-traffic-20261113'
        run: |
          python scripts/shipping_ports.py
          python - <<'PY'
          import json
          p=json.load(open('data/shipping-ports.json',encoding='utf-8'))
          s=p['source']
          assert s['status']=='ok', f"World Bank import failed: {s}"
          assert len(p['series']) >= 5
          assert all(x['isActualRate'] is False and x['unit']=='TEU'
                     for x in p['series'])
          print('World Bank live TEU series:',len(p['series']))
          PY
      - name: Validate live UNCTAD monthly connectivity import (isolated feature branch)
        if: github.ref == 'refs/heads/feature/stockwatch-maritime-intelligence-v5-20261113'
        run: |
          python scripts/shipping_unctad.py
          python - <<'PY'
          import json
          data=json.load(open('data/shipping-connectivity.json',encoding='utf-8'))
          assert data['source']['status']=='ok', data['source']
          assert len(data['series'])>=5
          assert all(s['isActualRate'] is False and s['frequency']=='monthly' for s in data['series'])
          print('UNCTAD live monthly series:',len(data['series']))
          PY
      - name: Probe new official sources without publishing data
        if: github.ref == 'refs/heads/feature/stockwatch-free-research-data-20261117' || github.ref == 'refs/heads/feature/stockwatch-nordic-sources-20261117'
        env:
          STOCKWATCH_SEC_USER_AGENT: ${{ vars.STOCKWATCH_SEC_USER_AGENT }}
        run: python scripts/free_research.py --probe
      - name: Fetch official no-key and registered-source data
        if: github.ref == 'refs/heads/main'
        env:
          STOCKWATCH_SEC_USER_AGENT: ${{ vars.STOCKWATCH_SEC_USER_AGENT }}
          STOCKWATCH_OPENFIGI_KEY: ${{ secrets.STOCKWATCH_OPENFIGI_KEY }}
          STOCKWATCH_ENTSOE_TOKEN: ${{ secrets.STOCKWATCH_ENTSOE_TOKEN }}
          STOCKWATCH_FRED_API_KEY: ${{ secrets.STOCKWATCH_FRED_API_KEY }}
          STOCKWATCH_EIA_API_KEY: ${{ secrets.STOCKWATCH_EIA_API_KEY }}
        run: |
          python scripts/open_data.py --mode auto
          python scripts/registered_sources.py
          python scripts/instrument_directory.py
          python scripts/research_coverage.py
          python scripts/entsoe_open.py
          python scripts/economic_feeds.py
          python scripts/shipping_open.py
          python scripts/shipping_ports.py
          python scripts/shipping_unctad.py
          python scripts/history_coverage.py
          python scripts/free_research.py
      - name: Refresh Eurostat RoRo cargo history
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: python scripts/collect_roro_traffic.py
      - name: Recover missing eligible official series from private archive
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          STOCKWATCH_R2_BUCKET: ${{ vars.STOCKWATCH_R2_BUCKET }}
          STOCKWATCH_R2_ACCOUNT_ID: ${{ secrets.STOCKWATCH_R2_ACCOUNT_ID }}
          STOCKWATCH_R2_ACCESS_KEY_ID: ${{ secrets.STOCKWATCH_R2_ACCESS_KEY_ID }}
          STOCKWATCH_R2_SECRET_ACCESS_KEY: ${{ secrets.STOCKWATCH_R2_SECRET_ACCESS_KEY }}
        run: |
          python -m pip install 'boto3>=1.40,<2'
          python scripts/recover_official_archive.py
      - name: Build compact source-level research index
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/stockwatch-dataset-storage-20261117'
        run: python scripts/dataset_store.py
      - name: Commit official-source datasets without racing the market scanner
        if: github.ref == 'refs/heads/main'
        run: python scripts/publish_data.py --mode official
      - name: Archive reviewed official datasets to private R2 (opt-in only)
        if: github.ref == 'refs/heads/main' && vars.STOCKWATCH_OPEN_DATA_ARCHIVE_ENABLED == 'true'
        env:
          STOCKWATCH_OPEN_DATA_ARCHIVE_ENABLED: ${{ vars.STOCKWATCH_OPEN_DATA_ARCHIVE_ENABLED }}
          STOCKWATCH_R2_BUCKET: ${{ vars.STOCKWATCH_R2_BUCKET }}
          STOCKWATCH_R2_ACCOUNT_ID: ${{ secrets.STOCKWATCH_R2_ACCOUNT_ID }}
          STOCKWATCH_R2_ACCESS_KEY_ID: ${{ secrets.STOCKWATCH_R2_ACCESS_KEY_ID }}
          STOCKWATCH_R2_SECRET_ACCESS_KEY: ${{ secrets.STOCKWATCH_R2_SECRET_ACCESS_KEY }}
        run: |
          python -m pip install 'boto3>=1.40,<2'
          python scripts/dataset_store.py --archive
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - name: Validate and build isolated public artifact
        run: |
          python tests/test_public_pages_v122.py
          python tests/test_verify_pages_release.py
          python scripts/build_public_pages_v122.py --out "$RUNNER_TEMP/stockwatch-public"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/stockwatch-public
      - name: Confirm Pages artifact is visible before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 18); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || true)
            if [[ "$count" =~ ^[0-9]+$ ]] && (( count >= 1 )); then
              echo "Pages artifact metadata available ($count candidate(s))."
              # GitHub's deploy-pages artifact lookup can lag the Actions API.
              # Briefly allow independent Pages indexing before deployment.
              sleep 20
              exit 0
            fi
            echo "Artifact metadata not ready (attempt $attempt/18)"
            sleep 5
          done
          echo "::error::Pages artifact not visible after bounded retries"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify actual published files match this release
        run: python scripts/verify_pages_release.py --attempts 12 --interval 10
