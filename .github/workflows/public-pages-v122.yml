name: V122 public artifact boundary
on:
  pull_request:
    paths:
      - 'scripts/public-pages-manifest-v122.json'
      - 'scripts/build_public_pages_v122.py'
      - 'scripts/visual_audit.py'
      - 'tests/test_public_pages_v122.py'
      - '.github/workflows/public-pages-v122.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python tests/test_public_pages_v122.py
      - run: python scripts/build_public_pages_v122.py --out "$RUNNER_TEMP/stockwatch-public"
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Audit all public routes against actual isolated artifact
        run: python scripts/visual_audit.py --site-root "$RUNNER_TEMP/stockwatch-public" --output visual-audit/public-v122 --strict-http --devices desktop mobile
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: stockwatch-isolated-public-audit
          path: visual-audit/public-v122/
          retention-days: 14
