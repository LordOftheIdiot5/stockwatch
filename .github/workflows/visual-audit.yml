name: Stockwatch visual audit
on:
  pull_request:
    paths:
      - 'scripts/visual_audit.py'
      - 'sitewide-polish-v111.css'
      - 'overview-firstfold-v116.css'
      - 'news-compact-v116.css'
      - 'tests/browser_check_news_320_v116.py'
      - 'tests/browser_check_firstfold_v116.py'
      - 'scripts/visual_acceptance_v116.py'
      - 'brand/workspace-navigation-v112.css'
      - 'brand/workspace-navigation-v112.js'
      - 'tests/browser_check_brand_navigation_v112.py'
      - 'tests/browser_check_sitewide_v111.py'
      - '*.html'
      - 'index.html'
      - 'news.html'
      - 'nasdaq-notices-v100.js'
      - 'nasdaq-notices-v100.css'
      - 'tests/browser_check_nasdaq_notices_v100.py'
      - 'v4.js'
      - 'overview-parity-v98.css'
      - 'overview-target-v110.css'
      - 'workspace-density-v110b.css'
      - 'workspace-density-v110b.js'
      - 'overview-structure-v110d.css'
      - 'overview-structure-v110d.js'
      - 'overview-geo-v110e.css'
      - 'overview-geo-v110e.js'
      - 'brand/world-land-ne110.svg'
      - 'company-cockpit-v110c.css'
      - 'company-cockpit-v110c.js'
      - 'company-workflow-v113.js'
      - 'secondary-markets-v114.js'
      - 'brand/data-portal.js'
      - 'brand/data-portal.css'
      - 'tests/browser_check_data_products_v115.py'
      - 'tests/test_data_portal_v115.mjs'
      - 'secondary-markets-v114.css'
      - 'tests/browser_check_secondary_v114.py'
      - 'core-research-v113.css'
      - 'tests/browser_check_core_research_v113.py'
      - 'research.js'
      - 'terminal.js'
      - 'compare.html'
      - 'spreads.html'
      - 'tests/browser_check_company_cockpit_v110c.py'
      - 'tests/browser_check_density_v110b.py'
      - 'company.html'
      - 'stocks.html'
      - 'shipping.html'
      - 'tests/browser_check_overview_v110.py'
      - 'tests/browser_check_overview_v98.py'
      - '.github/workflows/visual-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: V111 all-route desktop/mobile and expanded heatmap acceptance
        run: python tests/browser_check_sitewide_v111.py
      - name: V113 company navigation and history-source browser checks
        run: python tests/browser_check_core_research_v113.py
      - name: V114 secondary-market source status and full-page keyboard flows
        run: python tests/browser_check_secondary_v114.py
      - name: V115 source-safe public Data Products catalog and inquiry acceptance
        run: python tests/browser_check_data_products_v115.py
      - name: V116 first-screen panel geometry
        id: v116_firstfold
        continue-on-error: true
        run: python tests/browser_check_firstfold_v116.py
      - name: V116 full 19-route x 6-width x dark/light browser acceptance matrix
        id: v116_matrix
        continue-on-error: true
        run: python scripts/visual_acceptance_v116.py
      - name: V112 editorial routes, menu, theme, keyboard and screenshot checks
        run: python tests/browser_check_brand_navigation_v112.py
      - name: Capture checkout on desktop and mobile
        run: python scripts/visual_audit.py --output visual-audit/checkout
      - name: Capture public production pages
        if: always()
        run: python scripts/visual_audit.py --base-url https://stocks.nordl.dev/ --output visual-audit/live --pages overview stocks company terminal shipping spreads calendar health news compare commodities shorts intelligence directory history research datasets search
        continue-on-error: true
      - name: Save screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: stockwatch-visual-audit
          path: visual-audit/
          retention-days: 14
          if-no-files-found: error
      - name: Enforce V116 layout and browser matrix gates after evidence upload
        if: always()
        env:
          FIRSTFOLD: ${{ steps.v116_firstfold.outcome }}
          MATRIX: ${{ steps.v116_matrix.outcome }}
        run: |
          echo "First-fold: $FIRSTFOLD; full matrix: $MATRIX"
          test "$FIRSTFOLD" = "success" && test "$MATRIX" = "success"
