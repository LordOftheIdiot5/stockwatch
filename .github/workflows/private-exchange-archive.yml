name: Private exchange archive
on:
  schedule:
    - cron: '30 20 * * 1-5'
    - cron: '30 6 * * 2-6'
  workflow_dispatch:
    inputs:
      smoke_only:
        description: 'Write synthetic storage marker only'
        type: boolean
        default: true
  pull_request:
    paths:
      - 'scripts/private_r2_archive.py'
      - 'scripts/delayed_exchange.py'
      - 'tests/test_private_r2_archive.py'
      - 'tests/test_delayed_exchange.py'
      - '.github/workflows/private-exchange-archive.yml'
permissions:
  contents: read
concurrency:
  group: private-exchange-archive-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: |
          python -m unittest discover -s tests -p test_private_r2_archive.py
          python -m unittest discover -s tests -p test_delayed_exchange.py
  archive:
    needs: offline
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && ((github.event_name == 'workflow_dispatch' && inputs.smoke_only == true) || vars.STOCKWATCH_R2_RETENTION_APPROVED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install 'boto3>=1.40,<2'
      - name: Private Euronext archive or synthetic smoke test
        env:
          STOCKWATCH_R2_RETENTION_APPROVED: ${{ vars.STOCKWATCH_R2_RETENTION_APPROVED }}
          STOCKWATCH_R2_EURONEXT_MARKETS: ${{ vars.STOCKWATCH_R2_EURONEXT_MARKETS }}
          RECOVERY_ONLY: ${{ github.event_name == 'schedule' && github.event.schedule == '30 6 * * 2-6' }}
          STOCKWATCH_R2_BUCKET: ${{ vars.STOCKWATCH_R2_BUCKET }}
          STOCKWATCH_R2_ACCOUNT_ID: ${{ secrets.STOCKWATCH_R2_ACCOUNT_ID }}
          STOCKWATCH_R2_ACCESS_KEY_ID: ${{ secrets.STOCKWATCH_R2_ACCESS_KEY_ID }}
          STOCKWATCH_R2_SECRET_ACCESS_KEY: ${{ secrets.STOCKWATCH_R2_SECRET_ACCESS_KEY }}
          SMOKE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_only }}
        run: |
          if [ "$SMOKE_ONLY" = "true" ]; then
            python scripts/private_r2_archive.py --smoke-test
          elif [ "$RECOVERY_ONLY" = "true" ]; then
            python scripts/private_r2_archive.py --previous-only
          else
            python scripts/private_r2_archive.py
          fi
