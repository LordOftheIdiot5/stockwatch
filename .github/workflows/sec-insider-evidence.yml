name: SEC insider evidence retention validation
on:
  pull_request:
    paths:
      - 'scripts/sec_insider_evidence.py'
      - 'tests/test_sec_insider_evidence.py'
      - 'scripts/sec_insider_r2.py'
      - 'tests/test_sec_insider_r2.py'
      - '.github/workflows/sec-insider-evidence.yml'
  workflow_dispatch:
    inputs:
      retain_private:
        description: 'Retain scoped SEC evidence in private R2 and verify readback'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_sec_insider_evidence.py' -v
      - run: python -m unittest discover -s tests -p 'test_sec_insider_r2.py' -v
      - name: Validate scoped immutable evidence
        env:
          STOCKWATCH_SEC_USER_AGENT: ${{ vars.STOCKWATCH_SEC_USER_AGENT }}
        run: python scripts/sec_insider_evidence.py
      - uses: actions/upload-artifact@v5
        with:
          name: sec-insider-evidence-validation
          path: validation-artifacts/sec-insider/
          retention-days: 7
          if-no-files-found: error
      - name: Install private storage client
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.retain_private == true
        run: pip install 'boto3>=1.40,<2'
      - name: Verify permanent private storage
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.retain_private == true
        env:
          STOCKWATCH_R2_BUCKET: ${{ vars.STOCKWATCH_R2_BUCKET }}
          STOCKWATCH_R2_ACCOUNT_ID: ${{ secrets.STOCKWATCH_R2_ACCOUNT_ID }}
          STOCKWATCH_R2_ACCESS_KEY_ID: ${{ secrets.STOCKWATCH_R2_ACCESS_KEY_ID }}
          STOCKWATCH_R2_SECRET_ACCESS_KEY: ${{ secrets.STOCKWATCH_R2_SECRET_ACCESS_KEY }}
        run: python scripts/sec_insider_r2.py
