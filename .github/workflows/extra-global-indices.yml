name: Additional official market index validation
on:
  pull_request:
    paths:
      - 'scripts/extra_global_indices.py'
      - 'tests/test_extra_global_indices.py'
      - '.github/workflows/extra-global-indices.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_extra_global_indices.py' -v
      - run: python scripts/extra_global_indices.py --probe
      - run: node --check global-market-pulse.js
